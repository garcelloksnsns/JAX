name: APK Android de teste

on:
  push:
    branches:
      - codex/jax-agent-apk
  workflow_dispatch:
    inputs:
      app_url:
        description: URL HTTPS publicada do JAX (opcional; também pode configurar no APK)
        required: false
        type: string

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Instalar Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar e verificar shell Android
        working-directory: android
        env:
          APP_URL: ${{ inputs.app_url }}
        run: gradle --no-daemon '-PappUrl='"$APP_URL" assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: jax-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
